[project]
name = "h-sae"
version = "0.1.0"
description = "Incorporating Hierarchical Semantics in Sparse Autoencoder Architectures (arXiv:2506.01197v1) -- reference implementation built via the paper2code skill"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
real-models = ["transformers", "datasets"]
dev = ["pytest>=7.4.0"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
