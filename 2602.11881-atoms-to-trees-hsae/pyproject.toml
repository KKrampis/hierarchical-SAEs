[project]
name = "hsae"
version = "0.1.0"
description = "Hierarchical Sparse Autoencoders (arXiv:2602.11881v1) -- reference implementation built via the paper2code skill"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
viz = ["umap-learn", "matplotlib"]
real-models = ["transformers", "transformer-lens"]
dev = ["pytest>=7.4.0"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
