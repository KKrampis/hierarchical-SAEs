  implementation_notes:
    - "The paper explicitly says the 'only notable modification' to standard JumpReLU SAE training is the adaptive/dynamic sparsity weight (Appendix A.2) — everything else about per-level SAE training (straight-through L0 estimator, decoder renorm, ghost gradients) follows standard JumpReLU SAE practice from Rajamanoharan et al. (2024b)."
    - "The hierarchy index l is a dictionary-size tier ('level'), not depth in a neural network — each SAE_l is only a 2-layer (encoder/decoder) module."
    - "The similarity metric ablation (Figure 7) shows the three metrics (co-activation, decoder cosine sim, encoder cosine sim) are nearly interchangeable in final quality; implementers can start with encoder cosine similarity (the paper's default) and treat the others as optional configurable alternatives."
    - "Ablation results to reproduce as an implementation sanity check (Section 4.5 / Figure 4, Hamming distance, lower is better): Baseline (independent SAEs + post-hoc alignment) is worst, w/o Constraint = 29.7, w/ Constraint but w/o Perturbation ('constraint loss alone') ≈ 22.2 (i.e., 21.3 + 0.9 per the text), full HSAE = 21.3."
    - "Tree-topology ablation to reproduce (Appendix F.3 / Figure 9, Hamming distance, lower is better): Binary Tree = 22.8, Fix Tree = 24.2, Full Tree = 24.0, HSAE (partial tree, default) = 21.3."
    - "Main SAE-quality benchmark table (Table 1) gives concrete target numbers (L0, Variance Explained, Absorption, AutoInterp, RAVEL, SCR, Sparse Probing) for HSAE vs. Baseline at each of the 4 dictionary sizes on gemma2-2b layer 13 — useful as reproduction targets once SAEBench-style evaluation is implemented."
    - "Table 3 (Appendix E) gives additional reproduction targets across layers 6/13/20 of gemma2-2b, qwen3-4b layer 18, and target sparsities 80/100 on gemma2-2b layer 13."

