  implementation_notes:
    - "Unlike an adjacent-level-only hierarchy (e.g. HSAE, arXiv:2602.11881), Tree SAE allows a child at layer l to be parented by ANY feature at any strictly earlier layer (0..l-1) -- the allocation vector a_l indexes into the full concatenation of all earlier layers' features, not just layer l-1."
    - "Activation coverage (S_cov = 1) is enforced ARCHITECTURALLY via the recursive gate in Eq. 6, not as a soft loss term -- this is a key contrast with the paper's own critique of relying on the (post-hoc, threshold-based) activation-coverage MCS metric used by prior work."
    - "The reconstruction condition (Eq. 5, S_res) is NOT directly optimized by a loss term either -- instead, Appendix H proves that combining Eq. 6's coverage gating with the multi-level reconstruction loss (Eq. 7) *implies* high S_res at convergence (Proposition 1), so implementers should treat S_res purely as an EVALUATION metric (needs a trained linear probe as ground truth d*_c per feature), not something to add to the training loss directly."
      # -- notice this differs structurally from the companion HSAE paper (arXiv:2602.11881), which
      #    does add an explicit parent-children constraint loss term directly to training.
    - "The paper explicitly recommends AGAINST using the child's own encoder vector as a proxy for the true concept direction d*_c when computing S_res (Appendix H, Proposition 2) -- a separately trained linear probe per feature is required for faithful S_res evaluation."
    - "Best MCS baseline variant (for comparison purposes, e.g. to reproduce Figure 4/5's MCS curves) is 'non-scaling, binary activation correlation' (Appendix I) -- i.e., binarize both parent and child activations (nonzero -> 1) and compute plain correlation, with no additional magnitude scaling."
    - "The reallocation schedule's '+2' unit ('increase the interval by two after each allocation') is ambiguous in the source text; given the surrounding scale (3000 -> ... -> cap 10000), treating it as +2000 steps per event yields a plausible short sequence (3000, 5000, 7000, 9000, 10000, 10000, ...); flagged as [INFERRED] below."
    - "The dead-feature auxiliary reconstruction e_hat_l (Eq. 8) is computed from RAW (ungated) dead-feature pre-activations (matching the standard Gao et al. 2024 aux-loss convention, which always operates on raw/ungated dead features to give them a gradient signal regardless of the main gating mechanism)."

  missing_but_critical:
    - "Exact TopK value(s) k used for the main sparse activation function sigma are not restated numerically in this paper -- the paper says 'we use the same Top-k activation function ... with four different L0 levels ranging from 32 to 80' (Appendix C), i.e. L0 itself IS the TopK k value per configuration (32, 48, 64, or 80). [Use L0 directly as TopK's k.]"
    - "The exact initial allocation rule (how {a_l} is set before the first Algorithm 2 call) is not specified. [INFERRED: initialize uniformly at random among eligible parents at layers 0..l-1, or round-robin, documented as an implementation choice.]"
    - "The precise capacity-accumulation window T (number of batches over which per-parent batch-loss is summed before solving Eq. 10) is described only as 'a predefined number of batches T' without a stated numeric value -- in context it appears to equal the current reallocation interval (3000-10000 steps). [INFERRED: T = the current reallocation interval.]"
    - "The '+2' interval-growth unit for the reallocation schedule is ambiguous (could be +2 steps, +2000 steps, or x2 multiplicatively). [INFERRED default: +2000 steps per event, i.e. 3000, 5000, 7000, 9000, 10000(capped), ... -- exposed as a configurable constant.]"
    - "The exact gradient-normalization scheme ('we ... normalise the gradient ... at each backward step') is not specified numerically (global-norm clip value, or unit-norm rescale). [INFERRED: global gradient-norm clipping to a norm of 1.0, a common default; exposed as a configurable constant.]"
    - "The learning-rate schedule shape (constant vs. warmup vs. decay) is not given -- only the flat value 1e-4. [INFERRED: use a constant learning rate by default, exposed as configurable.]"
    - "How ties are broken in the greedy allocation heap (Algorithm 1) when multiple parents have equal marginal payoff is not specified. [INFERRED: arbitrary/stable tie-breaking via insertion order, which does not affect the OPTIMAL VALUE achieved (only which specific parent among equals receives the next child), per the proof in Appendix G.]"
